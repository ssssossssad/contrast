<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналізатор контрастності</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tool-container">
    <h2>Аналізатор контрастності (WCAG)</h2>
    
    <div class="controls">
        <div class="control-group">
            <label for="bgColor">Колір фону</label>
            <input type="color" id="bgColor" value="#ffffff">
        </div>
        <div class="control-group">
            <label for="textColor">Колір тексту</label>
            <input type="color" id="textColor" value="#000000">
        </div>
    </div>

    <div class="preview-box" id="previewBox">
        <p class="preview-text" id="previewText">Приклад інтерфейсу</p>
    </div>

    <div class="result" id="resultBox">
        Коефіцієнт: 21:1 (Ідеально)
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
