<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Аналізатор контрастності</title>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .tool-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .controls { display: flex; gap: 20px; justify-content: space-around; margin-bottom: 20px; }
        .control-group { display: flex; flex-direction: column; align-items: center; }
        input[type="color"] { border: none; width: 60px; height: 60px; border-radius: 8px; cursor: pointer; }
        .preview-box { padding: 40px; text-align: center; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; transition: 0.3s; }
        .preview-text { font-size: 24px; font-weight: bold; margin: 0; }
        .result { text-align: center; font-size: 18px; font-weight: bold; padding: 15px; border-radius: 8px; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="tool-container">
    <h2>Аналізатор контрастності (WCAG)</h2>
    
    <div class="controls">
        <div class="control-group">
            <label>Колір фону</label>
            <input type="color" id="bgColor" value="#ffffff">
        </div>
        <div class="control-group">
            <label>Колір тексту</label>
            <input type="color" id="textColor" value="#000000">
        </div>
    </div>

    <div class="preview-box" id="previewBox">
        <p class="preview-text" id="previewText">Приклад інтерфейсу</p>
    </div>

    <div class="result" id="resultBox">
        Коефіцієнт: 21:1 (Ідеально)
    </div>
</div>

<script>
    const bgColorInput = document.getElementById('bgColor');
    const textColorInput = document.getElementById('textColor');
    const previewBox = document.getElementById('previewBox');
    const previewText = document.getElementById('previewText');
    const resultBox = document.getElementById('resultBox');

    // Функція для переведення HEX в RGB
    function hexToRgb(hex) {
        let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        return [r, g, b];
    }

    // Обчислення яскравості (Luminance)
    function luminance(r, g, b) {
        let a = [r, g, b].map(function (v) {
            v /= 255;
            return v <= 0.03928 ? v / 12.92 : Math.pow( (v + 0.055) / 1.055, 2.4 );
        });
        return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
    }

    function calculateContrast() {
        let bgRgb = hexToRgb(bgColorInput.value);
        let textRgb = hexToRgb(textColorInput.value);
        
        let lum1 = luminance(...bgRgb);
        let lum2 = luminance(...textRgb);
        
        let brightest = Math.max(lum1, lum2);
        let darkest = Math.min(lum1, lum2);
        let contrast = (brightest + 0.05) / (darkest + 0.05);
        
        // Оновлюємо візуал
        previewBox.style.backgroundColor = bgColorInput.value;
        previewText.style.color = textColorInput.value;
        
        let ratio = contrast.toFixed(2);
        
        if (contrast >= 4.5) {
            resultBox.className = 'result pass';
            resultBox.innerHTML = `✅ Коефіцієнт: ${ratio}:1 <br><small>Текст добре читається (Тест пройдено)</small>`;
        } else {
            resultBox.className = 'result fail';
            resultBox.innerHTML = `❌ Коефіцієнт: ${ratio}:1 <br><small>Низький контраст! Порушення правил UX</small>`;
        }
    }

    bgColorInput.addEventListener('input', calculateContrast);
    textColorInput.addEventListener('input', calculateContrast);
    calculateContrast(); // Запуск при старті
</script>

</body>
</html>
